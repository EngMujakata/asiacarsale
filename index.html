<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title data-id="th-modified">
      AsiaCarSale – Thailand Cars for Zimbabwe
    </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #D0021B;
      --red-dark: #A80016;
      --black: #111111;
      --dark: #061A40;
      --gray: #F4F4F4;
      --mid: #888888;
      --border: #E8E8E8;
      --white: #FFFFFF;
      --green: #25D366;
    }

    html, body {
      font-family: 'Inter', sans-serif;
      background: var(--white);
      color: var(--black);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* ── TOP NAV ── */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--white);
      position: sticky;
      top: 0;
      z-index: 200;
      border-bottom: 1px solid var(--border);
    }
    .hamburger { font-size: 1.3rem; cursor: pointer; color: var(--black); }
    .brand-logo {
      height: 32px;
      width: auto;
      display: block;
    }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .currency-btn {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--white);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--black);
    }

    /* ── HERO ── */
    .hero {
      background: var(--black);
      position: relative;
      overflow: hidden;
      padding: 0;
    }
    .hero img {
      width: 100%;
      display: block;
    }

    /* ── SEARCH PANEL ── */
    .search-panel {
      background: var(--dark);
      padding: 14px 14px;
    }
    .search-panel h3 {
      color: var(--white);
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .search-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .search-field {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 9px;
      padding: 8px 10px;
    }
    .search-field label {
      display: block;
      font-size: 0.58rem;
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .search-field select {
      background: transparent;
      border: none;
      color: var(--white);
      font-size: 0.8rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      width: 100%;
      appearance: none;
      cursor: pointer;
    }
    .search-field select option { background: #222; color: var(--white); }
    .search-btn-full {
      width: 100%;
      background: var(--red);
      color: var(--white);
      border: none;
      border-radius: 9px;
      padding: 11px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
      letter-spacing: 0.2px;
    }

    /* ── SECTION HEADER ── */
    .sec-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px 8px;
    }
    .sec-header h2 { font-size: 0.92rem; font-weight: 800; }
    #recommendedSection .sec-header h2::before { content: '✨ '; font-size: 0.85em; }
    .sec-header a { font-size: 0.72rem; color: var(--red); font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 3px; }

    /* ── CAR CARDS ── */
    .cars-scroll {
      display: flex;
      gap: 12px;
      padding: 0 16px 20px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .cars-scroll::-webkit-scrollbar { display: none; }
    .car-card {
      min-width: 160px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      scroll-snap-align: start;
      flex-shrink: 0;
      cursor: pointer;
    }
    .car-card-img {
      position: relative;
      background: var(--gray);
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      overflow: hidden;
    }
    .car-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .car-card-body { padding: 10px; }
    .car-card-name { font-size: 0.8rem; font-weight: 700; margin-bottom: 2px; line-height: 1.3; }
    .car-card-meta { font-size: 0.65rem; color: var(--mid); margin-bottom: 6px; }
    .car-card-price { font-size: 0.9rem; font-weight: 800; color: var(--red); }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: var(--white);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 18px;
      z-index: 300;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      flex: 1;
    }
    .nav-item-icon { font-size: 1.2rem; }
    .nav-item-label { font-size: 0.6rem; font-weight: 600; color: var(--mid); }
    .nav-item.active .nav-item-icon,
    .nav-item.active .nav-item-label { color: var(--red); }

    /* ── BRAND FILTER ── */
    .brand-filter {
      display: flex;
      gap: 8px;
      padding: 0 16px 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .brand-filter::-webkit-scrollbar { display: none; }
    .brand-chip {
      flex-shrink: 0;
      background: var(--white);
      border: 1.5px solid var(--border);
      color: var(--mid);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
    }
    .brand-chip.active {
      background: var(--red);
      border-color: var(--red);
      color: var(--white);
    }
    .cars-empty {
      padding: 30px 16px;
      text-align: center;
      color: var(--mid);
      font-size: 0.85rem;
      width: 100%;
    }

    /* ── ADD/EDIT CAR MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 400;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: var(--white);
      width: 100%;
      max-width: 430px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 18px 18px 0 0;
      padding: 18px 18px 28px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-header h3 { font-size: 1.05rem; font-weight: 800; }
    .modal-close {
      background: var(--gray);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      color: var(--mid);
    }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--mid);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 0.88rem;
      font-family: 'Inter', sans-serif;
      color: var(--black);
      background: var(--white);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Photo Upload Grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .photo-thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--gray);
      border: 1.5px solid var(--border);
    }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-thumb-del {
      position: absolute;
      top: 3px; right: 3px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      font-size: 0.75rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .photo-thumb-add {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1.5px dashed var(--border);
      background: var(--gray);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--mid);
      font-size: 1.4rem;
    }

    .modal-submit {
      width: 100%;
      background: var(--red);
      color: var(--white);
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .modal-delete {
      width: 100%;
      background: var(--white);
      color: var(--red);
      border: 1.5px solid var(--red);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    /* ── DETAIL OVERLAY ── */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: var(--white);
      z-index: 500;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }
    .detail-overlay.open { display: flex; }
    .detail-topbar {
      position: sticky;
      top: 0;
      background: var(--white);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .detail-back {
      background: var(--gray);
      border: none;
      width: 34px; height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .detail-img-wrap {
      width: 100%;
      height: 240px;
      background: var(--gray);
    }
    .detail-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

    /* ── ADMIN PANEL ── */
    .admin-manage-btn {
      position: fixed;
      bottom: 78px;
      left: 16px;
      background: var(--dark);
      color: var(--white);
      border: none;
      padding: 10px 16px;
      border-radius: 24px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      z-index: 250;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .admin-panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 380;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .admin-panel-overlay.open { display: flex; }
    .admin-panel-sheet {
      background: var(--white);
      width: 100%;
      max-width: 430px;
      max-height: 80vh;
      overflow-y: auto;
      border-radius: 18px 18px 0 0;
      padding: 18px 18px 28px;
    }
    .admin-list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .admin-list-item img {
      width: 56px;
      height: 44px;
      object-fit: cover;
      border-radius: 6px;
    }
    .admin-list-info { flex: 1; min-width: 0; }
    .admin-list-name { font-size: 0.82rem; font-weight: 700; }
    .admin-list-price { font-size: 0.75rem; color: var(--red); font-weight: 700; }
    .admin-list-edit-btn {
      background: var(--gray);
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .admin-add-new-btn {
      width: 100%;
      background: var(--red);
      color: var(--white);
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
    }
    </style>
  </head>
  <body>

    <!-- TOP NAV -->
    <nav class="top-nav">
      <div class="hamburger">☰</div>
      <div style="font-weight: 900; font-size: 1.1rem; color: var(--dark)">AsiaCarSale</div>
      <div class="nav-right">
        <button class="currency-btn">USD ($)</button>
      </div>
    </nav>

    <!-- SEARCH PANEL / FILTERS -->
    <section class="search-panel">
      <h3>SEARCH VEHICLES</h3>
      <div class="search-grid">
        <div class="search-field">
          <label>Brand</label>
          <select id="searchMake" onchange="applyFilters()">
            <option value="">All Brands</option>
            <option value="Toyota">Toyota</option>
            <option value="Isuzu">Isuzu</option>
            <option value="Ford">Ford</option>
            <option value="Nissan">Nissan</option>
            <option value="Mazda">Mazda</option>
          </select>
        </div>
        <div class="search-field">
          <label>Price Range</label>
          <select id="searchPrice" onchange="applyFilters()">
            <option value="">Any Price</option>
            <option value="0-10000">Under $10,000</option>
            <option value="10000-20000">$10,000 - $20,000</option>
            <option value="20000-999999">Over $20,000</option>
          </select>
        </div>
        <div class="search-field" style="grid-column: span 2;">
          <label>Min Year</label>
          <select id="searchYear" onchange="applyFilters()">
            <option value="">Any Year</option>
            <option value="2015">2015+</option>
            <option value="2018">2018+</option>
            <option value="2020">2020+</option>
            <option value="2022">2022+</option>
          </select>
        </div>
      </div>
      <button class="search-btn-full" onclick="applyFilters()">Apply Filters</button>
    </section>

    <!-- BRAND FILTER STRIP -->
    <div style="padding-top: 14px;">
      <div class="brand-filter" id="brandChips">
        <button class="brand-chip active" onclick="selectChip('', this)">All</button>
        <button class="brand-chip" onclick="selectChip('Toyota', this)">Toyota</button>
        <button class="brand-chip" onclick="selectChip('Isuzu', this)">Isuzu</button>
        <button class="brand-chip" onclick="selectChip('Ford', this)">Ford</button>
        <button class="brand-chip" onclick="selectChip('Nissan', this)">Nissan</button>
      </div>
    </div>

    <!-- CARS DISPLAY SECTION -->
    <section id="recommendedSection">
      <div class="sec-header">
        <h2>Available Inventory</h2>
      </div>
      <div class="cars-scroll" id="carsContainer">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- MANAGE LISTINGS TRIGGER BUTTON -->
    <button class="admin-manage-btn" onclick="openAdminPanel()">⚙️ Manage Listings</button>

    <!-- ADMIN PANEL OVERLAY -->
    <div class="admin-panel-overlay" id="adminPanelOverlay">
      <div class="admin-panel-sheet">
        <div class="modal-header">
          <h3>Manage Listings</h3>
          <button class="modal-close" onclick="closeAdminPanel()">✕</button>
        </div>
        <button class="admin-add-new-btn" onclick="openAddModal()">+ Add New Car</button>
        <div id="adminCarList">
          <!-- Rendered via JS -->
        </div>
      </div>
    </div>

    <!-- ADD/EDIT CAR MODAL SHEET -->
    <div class="modal-overlay" id="carModalOverlay">
      <div class="modal-sheet">
        <div class="modal-header">
          <h3 id="modalTitle">Add New Car</h3>
          <button class="modal-close" onclick="closeCarModal()">✕</button>
        </div>
        <form id="carForm" onsubmit="saveCar(event)">
          <input type="hidden" id="carId" />
          
          <div class="form-group">
            <label>Car Photos</label>
            <div class="photo-grid" id="photoGrid">
              <label class="photo-thumb-add">
                +
                <input type="file" accept="image/*" multiple style="display:none" onchange="handleImageUpload(event)" />
              </label>
            </div>
          </div>

          <div class="form-group">
            <label>Car Name / Title</label>
            <input type="text" id="carName" required placeholder="e.g. Toyota Hilux Revo" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Brand</label>
              <select id="carBrand" required>
                <option value="Toyota">Toyota</option>
                <option value="Isuzu">Isuzu</option>
                <option value="Ford">Ford</option>
                <option value="Nissan">Nissan</option>
                <option value="Mazda">Mazda</option>
              </select>
            </div>
            <div class="form-group">
              <label>Price ($ USD)</label>
              <input type="number" id="carPrice" required placeholder="18500" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Year</label>
              <input type="number" id="carYear" required placeholder="2020" />
            </div>
            <div class="form-group">
              <label>Transmission</label>
              <select id="carTrans">
                <option value="Automatic">Automatic</option>
                <option value="Manual">Manual</option>
              </select>
            </div>
          </div>

          <button type="submit" class="modal-submit">Save Vehicle</button>
          <button type="button" class="modal-delete" id="deleteBtn" style="display:none" onclick="deleteCar()">Delete Vehicle</button>
        </form>
      </div>
    </div>

    <!-- CAR DETAIL VIEW OVERLAY -->
    <div class="detail-overlay" id="detailOverlay">
      <div class="detail-topbar">
        <button class="detail-back" onclick="closeDetail()">←</button>
        <h2 id="detailHeaderTitle">Vehicle Details</h2>
      </div>
      <div class="detail-img-wrap" id="detailImgWrap"></div>
      <div style="padding: 16px;">
        <h1 id="detailTitle" style="font-size: 1.3rem; font-weight:800;"></h1>
        <div id="detailPrice" style="font-size: 1.5rem; color: var(--red); font-weight: 800; margin: 8px 0;"></div>
        <div id="detailSpecs" style="color: var(--mid); font-size: 0.9rem; line-height: 1.6;"></div>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <div class="nav-item active" onclick="closeAdminPanel(); closeDetail();">
        <div class="nav-item-icon">🚗</div>
        <div class="nav-item-label">Home</div>
      </div>
      <div class="nav-item" onclick="openAdminPanel()">
        <div class="nav-item-icon">⚙️</div>
        <div class="nav-item-label">Manage</div>
      </div>
    </nav>

    <script>
      // Initial mock dataset if local storage is empty
      const defaultCars = [
        {
          id: '1',
          name: 'Toyota Hilux Revo 2.8',
          brand: 'Toyota',
          price: 18500,
          year: 2020,
          transmission: 'Automatic',
          images: ['https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=500&auto=format&fit=crop&q=60']
        },
        {
          id: '2',
          name: 'Isuzu D-Max BluePower',
          brand: 'Isuzu',
          price: 14200,
          year: 2019,
          transmission: 'Manual',
          images: ['https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=500&auto=format&fit=crop&q=60']
        }
      ];

      let currentImages = [];

      // Initialize storage
      function getStoredCars() {
        const data = localStorage.getItem('asia_cars_data');
        return data ? JSON.parse(data) : defaultCars;
      }

      function setStoredCars(cars) {
        localStorage.setItem('asia_cars_data', JSON.stringify(cars));
      }

      // App Startup
      document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('asia_cars_data')) {
          setStoredCars(defaultCars);
        }
        renderDashboardCars();
      });

      // Filter and render dashboard
      function applyFilters() {
        const selectedBrand = document.getElementById('searchMake').value;
        const selectedPrice = document.getElementById('searchPrice').value;
        const selectedYear = document.getElementById('searchYear').value;

        let cars = getStoredCars();

        cars = cars.filter(car => {
          let matchBrand = !selectedBrand || car.brand === selectedBrand;
          let matchYear = !selectedYear || car.year >= parseInt(selectedYear);
          let matchPrice = true;

          if (selectedPrice) {
            const [min, max] = selectedPrice.split('-').map(Number);
            matchPrice = car.price >= min && car.price <= max;
          }

          return matchBrand && matchYear && matchPrice;
        });

        renderCarsList(cars);
      }

      function selectChip(brand, btn) {
        document.querySelectorAll('.brand-chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('searchMake').value = brand;
        applyFilters();
      }

      function renderDashboardCars() {
        applyFilters();
      }

      function renderCarsList(cars) {
        const container = document.getElementById('carsContainer');
        container.innerHTML = '';

        if (cars.length === 0) {
          container.innerHTML = `<div class="cars-empty">No vehicles found matching your criteria.</div>`;
          return;
        }

        cars.forEach(car => {
          const coverImg = car.images && car.images.length > 0 
            ? car.images[0] 
            : 'https://via.placeholder.com/300x200?text=No+Image';

          const card = document.createElement('div');
          card.className = 'car-card';
          card.onclick = () => openDetail(car.id);
          card.innerHTML = `
            <div class="car-card-img">
              <img src="${coverImg}" alt="${car.name}">
            </div>
            <div class="car-card-body">
              <div class="car-card-name">${car.name}</div>
              <div class="car-card-meta">${car.year} • ${car.transmission}</div>
              <div class="car-card-price">$${Number(car.price).toLocaleString()}</div>
            </div>
          `;
          container.appendChild(card);
        });
      }

      /* ── ADMIN / MANAGE LISTINGS LOGIC ── */
      function openAdminPanel() {
        document.getElementById('adminPanelOverlay').classList.add('open');
        renderAdminList();
      }

      function closeAdminPanel() {
        document.getElementById('adminPanelOverlay').classList.remove('open');
        renderDashboardCars();
      }

      function renderAdminList() {
        const listContainer = document.getElementById('adminCarList');
        const cars = getStoredCars();
        listContainer.innerHTML = '';

        cars.forEach(car => {
          const coverImg = car.images && car.images.length > 0 ? car.images[0] : 'https://via.placeholder.com/100';
          const item = document.createElement('div');
          item.className = 'admin-list-item';
          item.innerHTML = `
            <img src="${coverImg}">
            <div class="admin-list-info">
              <div class="admin-list-name">${car.name}</div>
              <div class="admin-list-price">$${Number(car.price).toLocaleString()}</div>
            </div>
            <button class="admin-list-edit-btn" onclick="openEditModal('${car.id}')">Edit</button>
          `;
          listContainer.appendChild(item);
        });
      }

      /* ── ADD/EDIT MODAL FUNCTIONS ── */
      function openAddModal() {
        document.getElementById('modalTitle').innerText = 'Add New Car';
        document.getElementById('carForm').reset();
        document.getElementById('carId').value = '';
        document.getElementById('deleteBtn').style.display = 'none';
        currentImages = [];
        renderPhotoGrid();
        document.getElementById('carModalOverlay').classList.add('open');
      }

      function openEditModal(id) {
        const cars = getStoredCars();
        const car = cars.find(c => c.id === id);
        if (!car) return;

        document.getElementById('modalTitle').innerText = 'Edit Vehicle';
        document.getElementById('carId').value = car.id;
        document.getElementById('carName').value = car.name;
        document.getElementById('carBrand').value = car.brand;
        document.getElementById('carPrice').value = car.price;
        document.getElementById('carYear').value = car.year;
        document.getElementById('carTrans').value = car.transmission;
        document.getElementById('deleteBtn').style.display = 'block';

        currentImages = car.images ? [...car.images] : [];
        renderPhotoGrid();
        document.getElementById('carModalOverlay').classList.add('open');
      }

      function closeCarModal() {
        document.getElementById('carModalOverlay').classList.remove('open');
      }

      // Convert image upload to base64 string
      function handleImageUpload(e) {
        const files = Array.from(e.target.files);
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            currentImages.push(event.target.result);
            renderPhotoGrid();
          };
          reader.readAsDataURL(file);
        });
      }

      function removeImage(index) {
        currentImages.splice(index, 1);
        renderPhotoGrid();
      }

      function renderPhotoGrid() {
        const grid = document.getElementById('photoGrid');
        grid.querySelectorAll('.photo-thumb').forEach(el => el.remove());

        currentImages.forEach((imgSrc, index) => {
          const thumb = document.createElement('div');
          thumb.className = 'photo-thumb';
          thumb.innerHTML = `
            <img src="${imgSrc}">
            <button class="photo-thumb-del" type="button" onclick="removeImage(${index})">✕</button>
          `;
          grid.insertBefore(thumb, grid.lastElementChild);
        });
      }

      function saveCar(e) {
        e.preventDefault();
        const id = document.getElementById('carId').value;
        const name = document.getElementById('carName').value;
        const brand = document.getElementById('carBrand').value;
        const price = parseFloat(document.getElementById('carPrice').value);
        const year = parseInt(document.getElementById('carYear').value);
        const transmission = document.getElementById('carTrans').value;

        let cars = getStoredCars();

        if (id) {
          // Edit
          cars = cars.map(car => car.id === id ? {
            id, name, brand, price, year, transmission, images: currentImages
          } : car);
        } else {
          // Add New
          const newCar = {
            id: Date.now().toString(),
            name, brand, price, year, transmission,
            images: currentImages.length ? currentImages : ['https://via.placeholder.com/300x200?text=No+Image']
          };
          cars.push(newCar);
        }

        setStoredCars(cars);
        closeCarModal();
        renderAdminList();
        renderDashboardCars();
      }

      function deleteCar() {
        const id = document.getElementById('carId').value;
        if (!id) return;

        let cars = getStoredCars();
        cars = cars.filter(c => c.id !== id);
        setStoredCars(cars);

        closeCarModal();
        renderAdminList();
        renderDashboardCars();
      }

      /* ── DETAIL OVERLAY ── */
      function openDetail(id) {
        const cars = getStoredCars();
        const car = cars.find(c => c.id === id);
        if (!car) return;

        document.getElementById('detailHeaderTitle').innerText = car.name;
        document.getElementById('detailTitle').innerText = car.name;
        document.getElementById('detailPrice').innerText = `$${Number(car.price).toLocaleString()}`;
        document.getElementById('detailSpecs').innerHTML = `
          <strong>Brand:</strong> ${car.brand}<br>
          <strong>Year:</strong> ${car.year}<br>
          <strong>Transmission:</strong> ${car.transmission}
        `;

        const coverImg = car.images && car.images.length > 0 ? car.images[0] : 'https://via.placeholder.com/300';
        document.getElementById('detailImgWrap').innerHTML = `<img src="${coverImg}">`;

        document.getElementById('detailOverlay').classList.add('open');
      }

      function closeDetail() {
        document.getElementById('detailOverlay').classList.remove('open');
      }
    </script>
  </body>
</html>
